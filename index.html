const firebaseConfig={apiKey:"AIzaSyC91KWC6UGrNeQkP-wROb_2HI1xB4PZ6rc",authDomain:"onushilon-65666.firebaseapp.com",databaseURL:"https://onushilon-65666-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"onushilon-65666",storageBucket:"onushilon-65666.firebasestorage.app",messagingSenderId:"589839144735",appId:"1:589839144735:web:6e3243549f211cd5fc022a",measurementId:"G-NK0Y92400D"};

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function attr(v){return esc(v)}
function safeUrl(v){try{const u=new URL(String(v||''));return ['http:','https:'].includes(u.protocol)?u.href:''}catch(_){return ''}}
function imageOf(d){return safeUrl(d?.thumb||d?.thumbnail||d?.imgUrl||d?.imageUrl||d?.image||'')}

function parseResourceCode(raw){const m=String(raw||'').trim().match(/^(COURSE|EXAM|MATERIAL|CONTENT)\s*[:#-]\s*(.+)$/i);if(!m)return null;const type=m[1].toUpperCase()==='CONTENT'?'material':m[1].toLowerCase();const id=m[2].trim();return id?{type,id}:null}
function bannerTarget(b){if(!b)return null;let type=String(b.targetType||'').toLowerCase(),id=String(b.targetId||'').trim();if(type==='content')type='material';const parsed=parseResourceCode(b.targetCode||b.link||'');if((!type||!id)&&parsed){type=parsed.type;id=parsed.id}if((!type||!id)&&b.courseId){type='course';id=String(b.courseId)}if(type&&id)return {type,id};const url=safeUrl(b.link||'');return url?{type:'url',url}:null}

function courseInstructors(c){const list=Array.isArray(c?.instructors)?c.instructors.filter(x=>x&&(x.name||x.photo||x.image)):[];if(list.length)return list;if(c?.instructorName||c?.instructor||c?.instructorPhoto)return [{name:c.instructorName||c.instructor||'ইন্সট্রাক্টর',photo:c.instructorPhoto||''}];return []}
function instructorText(c){const names=courseInstructors(c).map(x=>String(x.name||'').trim()).filter(Boolean);return names.length?names.join(', '):'ইন্সট্রাক্টর নির্ধারিত নয়'}
function instructorCards(c){const list=courseInstructors(c);if(!list.length)return `<div class="instructor-box"><div class="avatar"><i class="fa-solid fa-chalkboard-user"></i></div><div><strong class="bn">ইন্সট্রাক্টর নির্ধারিত নয়</strong><span>Course instructor</span></div></div>`;return `<div class="instructor-list">${list.map((x,i)=>{const photo=safeUrl(x.photo||x.image||'');return `<div class="instructor-box"><div class="avatar">${photo?`<img src="${attr(photo)}" alt="${attr(x.name||'ইন্সট্রাক্টর')}" loading="lazy">`:`<i class="fa-solid fa-chalkboard-user"></i>`}</div><div><strong class="bn">${esc(x.name||`ইন্সট্রাক্টর ${i+1}`)}</strong><span>Course instructor</span></div></div>`}).join('')}</div>`}
function openExamTarget(examId){const exam=exams.find(e=>e.id===examId||e.title===examId);if(!exam){showError('এই কোডের পরীক্ষা পাওয়া যায়নি। Admin থেকে সঠিক EXAM কোড কপি করুন।');return}const mode=exam.examMode||exam.mode||'instant';const start=exam.scheduleStart?new Date(exam.scheduleStart):null;const end=exam.scheduleEnd?new Date(exam.scheduleEnd):null;const now=new Date();let status='';if(mode==='live'&&start&&!isNaN(start)&&now<start)status='পরীক্ষা শুরু হবে: '+start.toLocaleString('bn-BD');else if(mode==='live'&&end&&!isNaN(end)&&now>end)status='এই পরীক্ষার সময় শেষ হয়েছে।';else if(mode==='live')status='লাইভ পরীক্ষা এখন নির্ধারিত সময়ে আছে।';$('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal"><div class="modal-head"><div><h2 class="bn">${esc(exam.title||'পরীক্ষা')}</h2><p class="bn">${mode==='live'?'লাইভ পরীক্ষা':'Instant Exam'} · ${Number(exam.duration)||30} মিনিট</p></div><button class="icon-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button></div><div class="modal-body bn"><p>${esc(exam.category||exam.class||'সাধারণ পরীক্ষা')} · ${Number(exam.question_count||exam.questions?.length||0)}টি প্রশ্ন · ${Number(exam.total_marks||exam.totalMarks)||0} নম্বর</p>${mode==='live'&&exam.scheduleStart?`<p>শুরু: ${esc(start&&!isNaN(start)?start.toLocaleString('bn-BD'):exam.scheduleStart)}${exam.scheduleEnd?' · শেষ: '+esc(end&&!isNaN(end)?end.toLocaleString('bn-BD'):exam.scheduleEnd):''}</p>`:''}${status?`<div class="error-note" style="margin:12px 0">${esc(status)}</div>`:''}<button class="btn btn-green btn-block bn" onclick="startExam('${attr(exam.id)}')"><i class="fa-solid fa-play"></i> পরীক্ষা শুরু করুন</button><button class="btn btn-light btn-block bn" style="margin-top:8px" onclick="closeModal();goPage('exams')">পরীক্ষা কেন্দ্র দেখুন</button></div></section></div>`}
function typeName(t){return t==='pdf'?'PDF / নোটস':t==='exam'?'পরীক্ষা / কুইজ':'ভিডিও ক্লাস'}
function normalizeLinkType(item){const t=String(item?.type||'video').toLowerCase();return t==='pdf'||t.includes('pdf')?'pdf':t==='exam'||t.includes('exam')?'exam':'video'}

function isPremiumFlag(v){return v===true||String(v).toLowerCase()==='true'||String(v).toLowerCase()==='premium'}
function updateAuthUI(){const btn=$('headerAuthBtn');if(currentUser){btn.innerHTML=`<span class="avatar" style="width:25px;height:25px;font-size:10px">${userProfile?.photoURL?`<img src="${attr(userProfile.photoURL)}" alt="">`:esc((userProfile?.name||currentUser.email||'U').slice(0,1).toUpperCase())}</span><span>${esc((userProfile?.name||currentUser.email||'প্রোফাইল').split(' ')[0])}</span>`;btn.onclick=()=>goPage('profile');if(userProfile?.role==='admin'){const old=document.getElementById('adminQuickLink');if(!old){const a=document.createElement('button');a.id='adminQuickLink';a.className='top-link';a.textContent='অ্যাডমিন প্যানেল';a.onclick=()=>location.href='admin.html';document.querySelector('.top-actions').insertBefore(a,btn)}}}else{btn.innerHTML='<i class="fa-regular fa-user"></i> <span>লগইন / রেজিস্ট্রেশন</span>';btn.onclick=()=>openAuth('login');document.getElementById('adminQuickLink')?.remove()}}

async function supabaseGetCollection(name){const cfg=window.ONUSHILON_SUPABASE;if(!cfg?.url||!cfg?.key)throw new Error('Supabase config missing');const u=cfg.url+'/rest/v1/app_documents?select=document_id,data&collection_name=eq.'+encodeURIComponent(name);const r=await fetch(u,{headers:{apikey:cfg.key,Authorization:'Bearer '+cfg.key}});if(!r.ok)throw new Error('Supabase fallback failed ('+r.status+'): '+(await r.text()).slice(0,180));const rows=await r.json();return rows.map(x=>({id:x.document_id,...(x.data||{})}));}
async function getPublicCollection(name){try{const snap=await db.collection(name).get();return snap.docs.map(d=>({id:d.id,...d.data()}));}catch(firebaseError){console.warn('Firebase read failed; trying Supabase for '+name,firebaseError);return await supabaseGetCollection(name)}}
async function loadPublicData(){const tasks=[getPublicCollection('courses').then(rows=>{courses=rows.filter(c=>c.status==null||c.status==='active')}).catch(e=>{courses=[];console.error('courses Firebase/Supabase:',e)}),getPublicCollection('banners').then(rows=>{banners=rows.filter(b=>b.status==null||b.status==='active')}).catch(e=>{banners=[];console.error('banners Firebase/Supabase:',e)}),getPublicCollection('exams').then(rows=>{exams=rows.filter(x=>(x.status==null||x.status==='active')&&x.result_published!==true)}).catch(e=>{exams=[];console.error('exams Firebase/Supabase:',e)}),getPublicCollection('contents').then(rows=>{contents=rows}).catch(e=>{contents=[];console.error('contents Firebase/Supabase:',e)})];await Promise.all(tasks);renderPage()}

function bannerHTML(){if(!banners.length)return `<div class="banner-card"><div class="banner-overlay"><h3 class="bn">আপনার পরবর্তী সাফল্যের প্রস্তুতি শুরু হোক</h3><p class="bn">কোর্স, ক্লাস ও পরীক্ষার সবকিছু এক জায়গায়।</p><button class="mini-cta bn" onclick="goPage('courses')">কোর্স দেখুন <i class="fa-solid fa-arrow-right"></i></button></div></div>`;return banners.map(b=>{const img=safeUrl(b.imgUrl||b.imageUrl||b.thumb||'');const title=b.title||'বিশেষ অফার';const desc=b.description||'';const target=bannerTarget(b);const bid=attr(b.id);const actionable=!!target;const label=target?.type==='course'?'কোর্স দেখুন':target?.type==='exam'?'পরীক্ষা খুলুন':target?.type==='material'?'ম্যাটেরিয়াল খুলুন':'বিস্তারিত দেখুন';return `<div class="banner-card" ${actionable?`role="link" tabindex="0" aria-label="${attr(title)} খুলুন" style="cursor:pointer" onclick="openBannerTarget('${bid}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openBannerTarget('${bid}')}"`:''}>${img?`<img src="${attr(img)}" alt="${attr(title)}" loading="lazy" onerror="this.style.display='none'">`:''}<div class="banner-overlay"><h3 class="bn">${esc(title)}</h3><p class="bn">${esc(desc)}</p><button type="button" class="mini-cta bn" onclick="event.stopPropagation();${actionable?`openBannerTarget('${bid}')`:`goPage('courses')`}">${actionable?label:'কোর্স দেখুন'} <i class="fa-solid fa-arrow-right"></i></button></div></div>`}).join('')}
function courseCard(c){const img=imageOf(c);const enrolled=courseIsEnrolled(c.id);const price=Number(c.price)||0;const orig=Number(c.originalPrice)||0;return `<article class="course-card"><div class="course-thumb" role="button" tabindex="0" style="cursor:pointer" onclick="openCourse('${attr(c.id)}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openCourse('${attr(c.id)}')}">${img?`<img src="${attr(img)}" loading="lazy" alt="${attr(c.title||'কোর্স')}" onerror="this.outerHTML='<div class=thumb-fallback><i class=fa-solid fa-book-open></i></div>'">`:`<div class="thumb-fallback"><i class="fa-solid fa-book-open"></i></div>`}<span class="course-chip">${esc(c.category||c.class||'কোর্স')}</span></div><div class="course-body"><h3 class="course-title bn" style="cursor:pointer" onclick="openCourse('${attr(c.id)}')">${esc(c.title||'নামহীন কোর্স')}</h3><p class="course-desc bn">${esc(c.desc||c.description||'বিস্তারিত জানতে কোর্সটি খুলুন।')}</p><div class="course-meta"><span><i class="fa-solid fa-chalkboard-user"></i>${esc(instructorText(c))}</span>${c.class?`<span><i class="fa-solid fa-users"></i>${esc(c.class)}</span>`:''}</div><div class="price-row"><span class="price">${price===0?'ফ্রি':money(price)}</span>${orig>price&&orig>0?`<span class="old-price">${money(orig)}</span>`:''}</div><div class="card-actions"><button class="btn btn-light bn" onclick="openCourse('${c.id}')">বিস্তারিত</button><button class="btn ${enrolled?'btn-green':'btn-red'} bn" onclick="openCourse('${attr(c.id)}')">${enrolled?'কোর্স দেখুন':price===0?'এনরোল করুন':'কিনুন / এনরোল'}</button></div></div></article>`}
function renderHome(){const list=courses.slice(0,6);const enrolled=currentUser?courses.filter(c=>courseIsEnrolled(c.id)):[];$('appMain').innerHTML=`<div class="wrap"><section class="hero"><div class="hero-inner"><div><span class="hero-kicker bn"><i class="fa-solid fa-sparkles"></i> শেখা হোক গোছানো ও সহজ</span><h1 class="bn">${currentUser?`স্বাগতম, ${esc((userProfile?.name||currentUser.email||'শিক্ষার্থী').split(' ')[0])}!`:'আপনার শেখার যাত্রা শুরু হোক আজই'}</h1><p class="bn">কোর্স, অধ্যায়ভিত্তিক ভিডিও ক্লাস, PDF এবং অনুশীলনী পরীক্ষা—সব এক জায়গায়। কোর্স দেখতে লগইন করার প্রয়োজন নেই।</p><div class="hero-actions"><button class="btn btn-green bn" onclick="goPage('courses')"><i class="fa-solid fa-book-open"></i> সব কোর্স দেখুন</button>${currentUser?`<button class="btn btn-light bn" onclick="goPage('myCourses')"><i class="fa-solid fa-play"></i> আমার কোর্স</button>`:`<button class="btn btn-light bn" onclick="openAuth('register')"><i class="fa-solid fa-user-plus"></i> ফ্রি অ্যাকাউন্ট</button>`}</div></div><div class="hero-art"><div class="art-card"><i class="fa-solid fa-book-open-reader"></i></div><div class="art-chip bn"><i class="fa-solid fa-circle-check" style="color:var(--green)"></i> ক্লাস • নোটস • পরীক্ষা</div></div></div></section><section class="section"><div class="section-head"><div><h2 class="bn">অফার ও ঘোষণা</h2><p class="bn">নতুন কোর্স ও বিশেষ অফার দেখুন</p></div></div><div class="banner-track" id="bannerTrack">${bannerHTML()}</div></section>${currentUser?`<section class="section"><div class="section-head"><div><h2 class="bn">আমার কোর্স</h2><p class="bn">আপনি যেসব কোর্সে এনরোল করেছেন</p></div><button class="btn btn-soft-green btn-sm bn" onclick="goPage('myCourses')">সব দেখুন <i class="fa-solid fa-arrow-right"></i></button></div>${enrolled.length?`<div class="course-grid">${enrolled.slice(0,3).map(courseCard).join('')}</div>`:emptyState('fa-book-open','এখনো কোনো কোর্সে এনরোল করেননি।','নিচের কোর্সগুলো দেখে পছন্দের কোর্সে এনরোল করুন।')}</section>`:''}<section class="section"><div class="section-head"><div><h2 class="bn">জনপ্রিয় কোর্সসমূহ</h2><p class="bn">ইন্সট্রাক্টর ও কোর্সের বিস্তারিতসহ</p></div><button class="btn btn-soft-green btn-sm bn" onclick="goPage('courses')">সব কোর্স <i class="fa-solid fa-arrow-right"></i></button></div>${list.length?`<div class="course-grid">${list.map(courseCard).join('')}</div>`:emptyState('fa-book-open','এখনো কোনো কোর্স প্রকাশিত হয়নি।','অ্যাডমিন প্যানেল থেকে Active কোর্স প্রকাশ করলে এখানে দেখা যাবে।')}</section><section class="section"><div class="section-head"><div><h2 class="bn">পরীক্ষা কেন্দ্র</h2><p class="bn">Instant ও Live পরীক্ষার তালিকা</p></div><button class="btn btn-soft-green btn-sm bn" onclick="goPage('exams')">সব পরীক্ষা দেখুন</button></div>${exams.length?`<div class="exam-grid">${exams.slice(0,2).map(examCard).join('')}</div>`:emptyState('fa-pen-to-square','এখনো কোনো পরীক্ষা প্রকাশিত হয়নি।')}</section><div class="footer-note bn">অনুশীলন • পড়াশোনা ও পরীক্ষার নির্ভরযোগ্য সঙ্গী</div></div>`}
function renderCoursesPage(){const categories=['All',...new Set(courses.map(c=>c.category).filter(Boolean))];const filtered=selectedCourseFilter==='All'?courses: courses.filter(c=>c.category===selectedCourseFilter);$('appMain').innerHTML=`<div class="wrap"><div class="page-title"><div><h1 class="bn">সব কোর্স</h1><p class="bn">লগইন ছাড়াই কোর্সের বিস্তারিত ও ইন্সট্রাক্টর দেখুন। এনরোল করতে অ্যাকাউন্ট প্রয়োজন।</p></div></div><div class="filters">${categories.map(x=>`<button class="filter-chip ${selectedCourseFilter===x?'active':''} bn" onclick="filterCourses('${attr(x)}')">${x==='All'?'সব কোর্স':esc(x)}</button>`).join('')}</div><section class="section">${filtered.length?`<div class="course-grid">${filtered.map(courseCard).join('')}</div>`:emptyState('fa-book-open','এই ক্যাটাগরিতে কোনো কোর্স পাওয়া যায়নি।')}</section><div class="footer-note bn">অনুশীলন • কোর্স ও পরীক্ষা</div></div>`}
function filterCourses(category){selectedCourseFilter=category;renderCoursesPage()}
function renderMyCourses(){if(!currentUser){$('appMain').innerHTML=`<div class="wrap"><div class="page-title"><div><h1 class="bn">আমার কোর্স</h1><p class="bn">আপনার এনরোল করা কোর্স দেখতে লগইন করুন।</p></div></div>${loginPrompt('আমার কোর্স দেখতে ইমেইল দিয়ে লগইন করুন।')}</div>`;return}const list=courses.filter(c=>courseIsEnrolled(c.id));$('appMain').innerHTML=`<div class="wrap"><div class="page-title"><div><h1 class="bn">আমার কোর্স</h1><p class="bn">এখান থেকে ভিডিও, PDF এবং কোর্সের পরীক্ষাগুলোতে প্রবেশ করুন।</p></div></div>${list.length?`<div class="course-grid">${list.map(courseCard).join('')}</div>`:emptyState('fa-book-open','আপনি এখনো কোনো কোর্সে এনরোল করেননি।','সব কোর্স দেখুন এবং আপনার পছন্দের কোর্সে এনরোল করুন।')}<div style="margin-top:15px"><button class="btn btn-green bn" onclick="goPage('courses')">কোর্স খুঁজুন</button></div></div>`}
function loginPrompt(text){return `<div class="empty"><i class="fa-solid fa-lock"></i><strong class="bn">${esc(text)}</strong><div style="margin-top:13px"><button class="btn btn-green bn" onclick="openAuth('login')">লগইন করুন</button> <button class="btn btn-light bn" onclick="openAuth('register')">রেজিস্ট্রেশন</button></div></div>`}
function itemsForCourse(c){const hasEmbedded=Array.isArray(c.sections)&&c.sections.length>0;const sections=hasEmbedded?c.sections.map(s=>({...s,items:Array.isArray(s.items)?s.items.map(it=>({...it})):[]})):[];const related=contents.filter(x=>(x.linkedCourse||x.selectedCourseId)===c.id&&(!hasEmbedded||x.fromCourseManager!==true));for(const x of related){const type=normalizeLinkType(x),sectionName=String(x.courseSection||'').trim(),subject=String(x.subject||'সাধারণ').trim();let section=sections.find(s=>sectionName&&(String(s.title||'').trim()===sectionName||String(s.subject||'').trim()===sectionName));if(!section&&subject)section=sections.find(s=>String(s.subject||'').trim()===subject&&(!sectionName||String(s.title||'').trim()===sectionName));if(!section){const title=sectionName||subject||String(x.chapter||'ক্লাস ও ম্যাটেরিয়াল');section={subject,title,thumbnail:x.thumbnail||'',description:'',items:[]};sections.push(section)}section.items=Array.isArray(section.items)?section.items:[];const duplicate=section.items.some(it=>String(it.link||'').trim()===String(x.link||'').trim()&&String(it.title||'').trim()===String(x.title||'').trim()&&normalizeLinkType(it)===type);if(duplicate)continue;section.items.push({id:x.id,materialId:x.id,title:x.title||x.chapter||section.title,type,chapter:x.chapter||section.title,rule:x.rule||(x.accessMode==='course'||isPremiumFlag(x.isPremium)?'mandatory':'optional'),link:x.link||'',thumbnail:x.thumbnail||section.thumbnail||'',linkedCourse:c.id,accessMode:x.accessMode||'',fromContents:true})}return sections}
function embedVideoUrl(raw){const u=safeUrl(raw);if(!u)return '';try{const x=new URL(u),host=x.hostname.replace(/^www\./,'');if(host==='youtu.be')return 'https://www.youtube-nocookie.com/embed/'+x.pathname.split('/').filter(Boolean)[0];if(host.endsWith('youtube.com')||host==='youtube-nocookie.com'){if(x.pathname==='/watch')return 'https://www.youtube-nocookie.com/embed/'+(x.searchParams.get('v')||'');if(x.pathname.startsWith('/embed/'))return 'https://www.youtube-nocookie.com'+x.pathname;if(x.pathname.startsWith('/shorts/'))return 'https://www.youtube-nocookie.com/embed/'+x.pathname.split('/')[2]}if(host==='vimeo.com'||host.endsWith('.vimeo.com')){const id=x.pathname.split('/').filter(Boolean).pop();return id?'https://player.vimeo.com/video/'+id:u}if(host==='drive.google.com'&&x.pathname.includes('/file/d/')){const id=x.pathname.split('/file/d/')[1].split('/')[0];return 'https://drive.google.com/file/d/'+id+'/preview'}return u}catch(e){return u}}
function isDirectVideoFile(raw){try{return /\.(mp4|webm|ogg|mov|m4v)$/i.test(new URL(raw).pathname)}catch(_){return false}}
function videoPlayerHTML(raw,title){const url=safeUrl(raw);if(!url)return `<div class="empty bn">ভিডিও লিংকটি সঠিক নয়।</div>`;if(isDirectVideoFile(url))return `<video controls playsinline preload="metadata" style="display:block;width:100%;max-height:65vh;background:#111827;border-radius:12px" title="${attr(title||'ভিডিও ক্লাস')}"><source src="${attr(url)}"></video>`;const embed=embedVideoUrl(url);return embed?`<iframe class="video-frame" src="${attr(embed)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin" title="${attr(title||'ভিডিও ক্লাস')}"></iframe>`:`<div class="empty bn">এই ভিডিওটি অ্যাপে এমবেড করা যায়নি। নিচের লিংক দিয়ে খুলুন।</div>`}
function renderCourseDetails(id){const c=courses.find(x=>x.id===id);if(!c){$('appMain').innerHTML=`<div class="wrap"><div class="page-title"><button class="back-button bn" onclick="goPage('courses')"><i class="fa-solid fa-arrow-left"></i> ফিরে যান</button></div>${emptyState('fa-circle-exclamation','কোর্সটি পাওয়া যায়নি।')}</div>`;return}const enrolled=courseIsEnrolled(id);if(window.courseContentMode&&enrolled){renderEnrolledCourseContent(c);return}window.courseContentMode=false;const sections=itemsForCourse(c),img=imageOf(c),price=Number(c.price)||0;const promo=safeUrl(c.promoVideo||'');$('appMain').innerHTML=`<div class="wrap"><div class="page-title"><button class="back-button bn" onclick="goPage('courses')"><i class="fa-solid fa-arrow-left"></i> সব কোর্স</button>${enrolled?`<span class="tag bn"><i class="fa-solid fa-circle-check"></i> এনরোল করা আছে</span>`:''}</div><section class="course-detail-hero"><div class="detail-media-stack"><div class="detail-image">${img?`<img src="${attr(img)}" alt="${attr(c.title||'কোর্স')}" onerror="this.style.display='none'">`:`<i class="fa-solid fa-book-open-reader" style="font-size:55px;color:var(--green)"></i>`}</div>${promo?`<div class="detail-promo">${videoPlayerHTML(promo,'কোর্স প্রোমো ভিডিও')}</div>`:''}</div><div class="detail-copy"><span class="tag bn">${esc(c.category||'কোর্স')} ${c.class?'• '+esc(c.class):''}</span><h1 class="bn">${esc(c.title||'কোর্স')}</h1><p class="bn">${esc(c.desc||c.description||'এই কোর্সের বিস্তারিত তথ্য শীঘ্রই যোগ করা হবে।')}</p><div class="price-row"><span class="price">${price===0?'ফ্রি':money(price)}</span>${Number(c.originalPrice)>price?`<span class="old-price">${money(c.originalPrice)}</span>`:''}</div>${instructorCards(c)}<div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:15px;width:100%">${enrolled?`<button class="btn btn-green bn" onclick="openCourseContent('${attr(c.id)}')"><i class="fa-solid fa-play"></i> কোর্সের কনটেন্ট দেখুন</button>`:`<button class="btn ${price===0?'btn-green':'bt async function startEnrollment(id){const c=courses.find(x=>x.id===id);if(!c)return;if(!currentUser){pendingEnrollCourse=id;openAuth('login');return}if(courseIsEnrolled(id)){openCourse(id);return}if((Number(c.price)||0)===0){const ask=await Swal.fire({title:'কোর্সে এনরোল করবেন?',text:c.title||'এই ফ্রি কোর্সে এনরোল করা হবে।',icon:'question',showCancelButton:true,confirmButtonText:'এনরোল করুন',cancelButtonText:'পরে',confirmButtonColor:'#07875a'});if(!ask.isConfirmed)return;try{await db.collection('users').doc(currentUser.uid).set({enrolledCourses:firebase.firestore.FieldValue.arrayUnion(id),updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});userProfile.enrolledCourses=[...(userProfile.enrolledCourses||[]),id];showToast('কোর্সে এনরোল সম্পন্ন হয়েছে');openCourse(id)}catch(e){showError('এনরোল করা যায়নি: '+friendlyError(e))}}else openPaymentModal(c)}

async function submitAuth(e){e.preventDefault();const btn=$('authSubmitBtn');btn.disabled=true;const orig=btn.innerHTML;btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> অপেক্ষা করুন…';try{const email=$('authEmail').value.trim().toLowerCase(),password=$('authPassword').value;if(authMode==='register'){const name=$('authName').value.trim();if(!name)throw new Error('আপনার নাম লিখুন।');const cred=await auth.createUserWithEmailAndPassword(email,password);await cred.user.updateProfile({displayName:name});const profile={uid:cred.user.uid,name,email,role:'student',status:'active',gender:'',phone:'',class:'',batch:'',photoURL:'',isPremium:false,enrolledCourses:[],courseProgress:{},createdAt:firebase.firestore.FieldValue.serverTimestamp()};await db.collection('users').doc(cred.user.uid).set(profile);userProfile={...profile};}else await auth.signInWithEmailAndPassword(email,password);closeModal();showToast(authMode==='register'?'রেজিস্ট্রেশন সফল হয়েছে':'লগইন সফল হয়েছে');}catch(err){showError(friendlyError(err))}finally{if($('authSubmitBtn')){$('authSubmitBtn').disabled=false;$('authSubmitBtn').innerHTML=orig}}}

function friendlyError(e){const code=e?.code||'';const map={'permission-denied':'Firestore Rules-এ এই কাজের অনুমতি নেই।','unavailable':'Firebase সার্ভারে সংযোগ পাওয়া যাচ্ছে না। ইন্টারনেট ও Firebase project config দেখুন।','auth/invalid-email':'ইমেইল ঠিকানাটি সঠিক নয়।','auth/user-not-found':'এই ইমেইলে কোনো অ্যাকাউন্ট পাওয়া যায়নি।','auth/wrong-password':'পাসওয়ার্ড সঠিক নয়।','auth/invalid-credential':'ইমেইল বা পাসওয়ার্ড সঠিক নয়।','auth/email-already-in-use':'এই ইমেইলে আগে থেকেই অ্যাকাউন্ট আছে।','auth/weak-password':'পাসওয়ার্ড অন্তত ৬ অক্ষরের হতে হবে।','auth/network-request-failed':'ইন্টারনেট সংযোগ পরীক্ষা করুন।','storage/unauthorized':'Firebase Storage Rules-এ আপলোডের অনুমতি নেই।'};return map[code]||e?.message||'একটি অপ্রত্যাশিত সমস্যা হয়েছে।'}

function examCard(e){const premium=isPremiumFlag(e.isPremium)||e.access==='premium';const mode=e.examMode||e.mode||'instant';const locked=premium&&!courseIsEnrolled(e.linkedCourse);return `<article class="exam-card"><div class="exam-meta"><span class="pill ${mode==='live'?'red':'green'}">${mode==='live'?'লাইভ পরীক্ষা':'Instant Exam'}</span><span class="pill navy">${premium?'এনরোল্ড শিক্ষার্থীদের জন্য':'ফ্রি'}</span></div><h3 class="bn">${esc(e.title||'নামহীন পরীক্ষা')}</h3><div class="exam-meta"><span class="pill"><i class="fa-regular fa-clock"></i>${Number(e.duration)||30} মিনিট</span><span class="pill"><i class="fa-solid fa-list-ol"></i>${Number(e.question_count||e.questions?.length||0)} প্রশ্ন</span><span class="pill"><i class="fa-solid fa-star"></i>${Number(e.total_marks||e.totalMarks)||0} নম্বর</span></div><p class="muted bn" style="font-size:12px;line-height:1.7;margin:0">${mode==='live'&&e.scheduleStart?`শুরু: ${esc(new Date(e.scheduleStart).toLocaleString('bn-BD'))}${e.scheduleEnd?' • শেষ: '+esc(new Date(e.scheduleEnd).toLocaleString('bn-BD')):''} · `:''}${esc(e.category||e.class||'সাধারণ পরীক্ষা')} ${e.attemptPolicy==='multiple'?'• একাধিকবার দেওয়া যাবে':''}</p><button class="btn btn-green btn-block bn" onclick="startExam('${e.id}')"><i class="fa-solid ${locked?'fa-lock':'fa-play'}"></i> ${locked?'এনরোলমেন্ট প্রয়োজন':'পরীক্ষা শুরু করুন'}</button></article>`}
function filterExamMode(mode,btn){document.querySelectorAll('.filters .filter-chip').forEach(b=>b.classList.remove('active'));btn.classList.add('active');const filtered=mode==='all'?exams.filter(e=>e.status!=='draft'):exams.filter(e=>e.status!=='draft'&&(e.examMode||e.mode||'instant')===mode);const root=$('examList');if(root)root.innerHTML=filtered.length?filtered.map(examCard).join(''):emptyState('fa-pen-to-square','এই ধরনে কোনো পরীক্ষা নেই।')}
async function startExam(id){const exam=exams.find(e=>e.id===id);if(!exam)return showError('পরীক্ষাটি পাওয়া যায়নি।');const mode=exam.examMode||exam.mode||'instant';if(mode==='live'){const now=Date.now(),start=exam.scheduleStart?new Date(exam.scheduleStart).getTime():NaN,end=exam.scheduleEnd?new Date(exam.scheduleEnd).getTime():NaN;if(Number.isFinite(start)&&now<start){showError('লাইভ পরীক্ষা এখনো শুরু হয়নি। শুরু হবে '+new Date(start).toLocaleString('bn-BD'));return}if(Number.isFinite(end)&&now>end){showError('লাইভ পরীক্ষার সময় শেষ হয়েছে।');return}}if(!currentUser){pendingEnrollCourse=null;pendingStartExamId=id;openAuth('login');return}if((isPremiumFlag(exam.isPremium)||exam.access==='premium')&&exam.linkedCourse&&!courseIsEnrolled(exam.linkedCourse)&&!userProfile?.isPremium&&userProfile?.role!=='admin'){showError('এই পরীক্ষাটি সংশ্লিষ্ট কোর্সে এনরোল করা শিক্ষার্থীদের জন্য।');return}if((exam.attemptPolicy||'single')==='single'){try{const prior=await db.collection('exam_submissions').where('examId','==',id).where('uid','==',currentUser.uid).get();if(!prior.empty){showError('এই পরীক্ষা আপনার আগে দেওয়া হয়েছে।');return}}catch(e){console.warn('Attempt limit check unavailable:',e)}}let questions=Array.isArray(exam.questions)?exam.questions:[];if(!questions.length){if(exam.content_html){$('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal"><div class="modal-head"><div><h2 class="bn">${esc(exam.title||'পরীক্ষা')}</h2><p>পুরোনো ফরম্যাটের পরীক্ষা</p></div><button class="icon-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button></div><div class="modal-body bn"><div>${exam.content_html}</div><p class="error-note">এই পরীক্ষার প্রশ্নগুলো পুরোনো HTML ফরম্যাটে আছে; স্বয়ংক্রিয় মূল্যায়নের জন্য অ্যাডমিন প্যানেল থেকে structured questions হিসেবে আপডেট করতে হবে।</p></div></section></div>`;return}showError('এই পরীক্ষায় এখনো প্রশ্ন যোগ করা হয়নি।');return}const optSubjects=Array.isArray(exam.optionalSubjects)?exam.optionalSubjects:typeof exam.optionalSubjects==='string'?exam.optionalSubjects.split(',').map(x=>x.trim()).filter(Boolean):[];const count=Math.max(0,Number(exam.optionalCount)||0);if(optSubjects.length&&count>0){showOptionalSubjects(exam,questions,optSubjects,count);return}beginExam(exam,questions)}
function showOptionalSubjects(exam,questions,subjects,count){const boxes=subjects.map((s,i)=>`<label class="exam-option"><input type="checkbox" value="${attr(s)}" name="optionalSubject"><span class="bn">${esc(s)}</span></label>`).join('');$('modalRoot').innerHTML=`<div class="modal-backdrop"><section class="modal"><div class="modal-head"><div><h2 class="bn">ঐচ্ছিক বিষয় নির্বাচন</h2><p class="bn">${esc(exam.title||'পরীক্ষা')}</p></div></div><div class="modal-body"><p class="bn" style="line-height:1.8">নিচের বিষয়গুলো থেকে ঠিক <b>${count}</b>টি নির্বাচন করুন। আবশ্যিক বিষয় থাকলে সেগুলোর প্রশ্নও পরীক্ষায় থাকবে।</p><div class="options">${boxes}</div><div class="field" style="margin-top:17px"><button class="btn btn-green btn-block bn" onclick="confirmOptionalSubjects('${exam.id}',${count})">পরীক্ষা শুরু করুন</button><button class="btn btn-light btn-block bn" style="margin-top:8px" onclick="closeModal()">বাতিল</button></div></div></section></div>`}
function confirmOptionalSubjects(id,count){const chosen=[...document.querySelectorAll('input[name="optionalSubject"]:checked')].map(x=>x.value);if(chosen.length!==count){showError(`ঠিক ${count}টি ঐচ্ছিক বিষয় নির্বাচন করুন।`);return}const exam=exams.find(e=>e.id===id);if(exam)beginExam(exam,Array.isArray(exam.questions)?exam.questions:[],chosen)}
function beginExam(exam,questions,selectedOptional=[]){const required=Array.isArray(exam.requiredSubjects)?exam.requiredSubjects:typeof exam.requiredSubjects==='string'?exam.requiredSubjects.split(',').map(x=>x.trim()).filter(Boolean):[];const optional=Array.isArray(exam.optionalSubjects)?exam.optionalSubjects:typeof exam.optionalSubjects==='string'?exam.optionalSubjects.split(',').map(x=>x.trim()).filter(Boolean):[];let filtered=questions;if(selectedOptional.length){filtered=questions.filter(q=>{const subject=String(q.subject||'').trim();return !subject||required.includes(subject)||selectedOptional.includes(subject)||(!required.length&&!optional.includes(subject))})}currentExam=exam;currentExamQuestions=filtered;examAnswers={};selectedCourseFilter='All';currentPage='examTake';closeModal();renderExamTake();navActive();window.scrollTo({top:0,behavior:'smooth'});examSeconds=Math.max(1,Number(exam.duration)||30)*60;if(examTimer)clearInterval(examTimer);examTimer=setInterval(()=>{examSeconds--;const el=$('examTimer');if(el)el.textContent=formatTime(examSeconds);if(examSeconds<=0){clearInterval(examTimer);examTimer=null;submitExam(true)}},1000)}
function formatTime(sec){sec=Math.max(0,sec);return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function renderExamTake(){if(!currentExam){currentPage='exams';renderExamsPage();return}const qs=currentExamQuestions;$('appMain').innerHTML=`<div class="wrap"><div class="page-title"><div><h1 class="bn">${esc(currentExam.title||'পরীক্ষা')}</h1><p class="bn">প্রতিটি প্রশ্ন ভালোভাবে পড়ে একটি সঠিক উত্তর নির্বাচন করুন।</p></div><button class="back-button bn" onclick="cancelExam()"><i class="fa-solid fa-xmark"></i> বের হয়ে যান</button></div><div class="exam-sticky"><span class="bn"><b>${qs.length}</b> টি প্রশ্ন · <b>${Number(currentExam.total_marks)||qs.length}</b> নম্বর</span><span class="timer" id="examTimer">${formatTime(examSeconds||Number(currentExam.duration||30)*60)}</span></div><form id="examAnswerForm" onsubmit="submitExam(false);return false"><div>${qs.map((q,i)=>{const img=safeUrl(q.imageUrl||q.image||'');const options=Array.isArray(q.options)?q.options:[];return `<article class="question-card"><div class="question-top"><strong class="bn">প্রশ্ন ${i+1}</strong><span class="pill green">${esc(q.subject||'')}</span></div><div class="question-text bn">${esc(q.q||q.question||'')}</div>${img?`<img class="question-image" src="${attr(img)}" alt="প্রশ্নের ছবি">`:''}<div class="options">${options.map((o,j)=>{const key=o.key||String.fromCharCode(65+j),oi=safeUrl(o.imageUrl||o.image||'');return `<label class="exam-option"><input type="radio" name="answer_${i}" value="${attr(key)}" onchange="examAnswers[${i}]='${attr(key)}'"><span style="font-weight:900;min-width:20px">${esc(key)}.</span><span style="flex:1">${esc(o.text||'')}${oi?`<img src="${attr(oi)}" alt="অপশনের ছবি">`:''}</span></label>`}).join('')}</div></article>`}).join('')}</div><div style="margin:20px 0 30px"><button class="btn btn-red btn-block bn" type="submit"><i class="fa-solid fa-paper-plane"></i> পরীক্ষা জমা দিন</button></div></form></div>`;if(window.MathJax?.typesetPromise)window.MathJax.typesetPromise().catch(()=>{})}
function cancelExam(){if(examTimer)clearInterval(examTimer);examTimer=null;currentExam=null;currentPage='exams';renderPage();navActive()}
async function submitExam(autoSubmit=false){if(!currentExam)return;if(examTimer)clearInterval(examTimer);examTimer=null;if(!autoSubmit){const answered=Object.keys(examAnswers).length;const ask=await Swal.fire({title:'পরীক্ষা জমা দেবেন?',text:`${answered} টি প্রশ্নের উত্তর নির্বাচন করেছেন।`,icon:'question',showCancelButton:true,confirmButtonText:'জমা দিন',cancelButtonText:'আরও দেখুন',confirmButtonColor:'#d6283f'});if(!ask.isConfirmed){examTimer=setInterval(()=>{examSeconds--;const el=$('examTimer');if(el)el.textContent=formatTime(examSeconds);if(examSeconds<=0){clearInterval(examTimer);examTimer=null;submitExam(true)}},1000);return}}const exam=currentExam,questions=currentExamQuestions;let score=0,correct=0,wrong=0,skipped=0;const total=Number(exam.total_marks)||questions.length;const per=questions.length?total/questions.length:0;const wrongRows=[];questions.forEach((q,i)=>{const selected=examAnswers[i];if(!selected){skipped++;return}const answer=String(q.answer||q.correctAnswer||exam.answer_key?.[String(i+1)]||'').toUpperCase();if(selected.toUpperCase()===answer){score+=per;correct++}else{score-=Number(exam.negative_marking)||0;wrong++;wrongRows.push({qNum:i+1,wrongAns:selected,rightAns:answer})}});score=Math.max(0,Math.min(total,score));score=Number(score.toFixed(2));let saveError='';try{await db.collection('exam_submissions').add({examId:exam.id,uid:currentUser.uid,userName:userProfile?.name||currentUser.email,score,correctCount:correct,wrongCount:wrong,skippedCount:skipped,totalMarks:total,answers:examAnswers,submittedAt:firebase.firestore.FieldValue.serverTimestamp()});await db.collection('exam_results').add({uid:currentUser.uid,examId:exam.id,examName:exam.title||'',marks:score,totalMarks:total,date:firebase.firestore.FieldValue.serverTimestamp()})}catch(err){saveError=friendlyError(err)}currentExam=null;currentPage='examResult';$('appMain').innerHTML=`<div class="wrap"><div class="page-title"><div><h1 class="bn">পরীক্ষার ফলাফল</h1><p class="bn">${esc(exam.title||'পরীক্ষা')}</p></div></div><div class="result-box"><i class="fa-solid fa-circle-check" style="font-size:34px;color:var(--green)"></i><div class="result-score">${score} / ${total}</div><p class="bn" style="margin:4px 0 15px;color:var(--green-dark);font-weight:800">পরীক্ষা সম্পন্ন হয়েছে</p><div class="stat-row"><div class="stat-box"><strong>${correct}</strong><span class="bn">সঠিক উত্তর</span></div><div class="stat-box"><strong style="color:var(--red)">${wrong}</strong><span class="bn">ভুল উত্তর</span></div><div class="stat-box"><strong>${skipped}</strong><span class="bn">উত্তর দেননি</span></div></div></div>${saveError?`<p class="error-note bn" style="margin-top:14px">ফলাফল স্কোর হয়েছে, কিন্তু Firestore-এ সেভ হয়নি: ${esc(saveError)}</p>`:''}<section class="section"><div class="section-head"><div><h2 class="bn">উত্তর পর্যালোচনা</h2><p class="bn">সঠিক উত্তর ও ব্যাখ্যা দেখুন</p></div></div>${questions.map((q,i)=>{const ans=String(q.answer||q.correctAnswer||exam.answer_key?.[String(i+1)]||'').toUpperCase();const u=examAnswers[i]||'';const ok=!!u&&u.toUpperCase()===ans;return `<article class="question-card"><div class="question-top"><strong class="bn">প্রশ্ন ${i+1}</strong><span class="pill ${ok?'green':u?'red':'navy'}">${ok?'সঠিক':u?'ভুল':'উত্তর দেওয়া হয়নি'}</span></div><div class="question-text bn">${esc(q.q||q.question||'')}</div><p class="bn muted" style="font-size:12px;margin:12px 0">আপনার উত্তর: <b>${esc(u||'—')}</b> · সঠিক উত্তর: <b style="color:var(--green-dark)">${esc(ans||'—')}</b></p>${q.explanation?`<div class="bn" style="background:#f6faf8;border-radius:11px;padding:12px;font-size:12px;line-height:1.8"><b>ব্যাখ্যা:</b><br>${esc(q.explanation)}</div>`:''}</article>`}).join('')}</section><button class="btn btn-green bn" onclick="currentPage='exams';renderPage();navActive()">পরীক্ষায় ফিরে যান</button></div>`;navActive();window.scrollTo({top:0,behavior:'smooth'});if(window.MathJax?.typesetPromise)window.MathJax.typesetPromise().catch(()=>{})}
function renderProfile(){if(!currentUser){$('appMain').innerHTML=`<div class="wrap"><div class="page-title"><div><h1 class="bn">আমার প্রোফাইল</h1><p class="bn">ব্যক্তিগত তথ্য ও এনরোলমেন্ট দেখতে লগইন করুন।</p></div></div>${loginPrompt('প্রোফাইল দেখতে আপনার অ্যাকাউন্টে লগইন করুন।')}</div>`;return}const p=userProfile||{};$('appMain').innerHTML=`<div class="wrap"><div class="page-title"><div><h1 class="bn">আমার প্রোফাইল</h1><p class="bn">আপনার ব্যক্তিগত তথ্য আপডেট করুন এবং পাসওয়ার্ড পরিবর্তন করুন।</p></div><button class="btn btn-soft-red btn-sm bn" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> লগআউট</button></div><div class="profile-grid"><aside class="profile-card"><div class="profile-photo" id="profilePhotoPreview">${p.photoURL?`<img src="${attr(p.photoURL)}" alt="প্রোফাইল">`:`<i class="fa-solid fa-user"></i>`}</div><h2 class="bn" style="font-size:20px;margin:0">${esc(p.name||currentUser.displayName||'শিক্ষার্থী')}</h2><div class="muted" style="font-size:12px;margin-top:5px">${esc(currentUser.email||'')}</div><div class="stat-row" style="grid-template-columns:1fr 1fr"><div class="stat-box"><strong>${(p.enrolledCourses||[]).length}</strong><span class="bn">এনরোল কোর্স</span></div><div class="stat-box"><strong>${p.isPremium?'PRO':'Student'}</strong><span class="bn">অ্যাকাউন্ট</span></div></div><div class="field" style="text-align:left"><label class="bn">প্রোফাইল ছবি</label><label class="photo-pick bn"><i class="fa-solid fa-images"></i> গ্যালারি থেকে ছবি <input type="file" id="profileImageFile" accept="image/*" onchange="uploadProfilePhoto(this)"></label></div><p class="auth-note bn">ছবি Firebase Storage-এ সংরক্ষণ হবে। আপলোডের জন্য Storage Rules-এ অনুমতি প্রয়োজন।</p></aside><section class="form-panel"><div class="section-head"><div><h2 class="bn" style="font-size:18px">ব্যক্তিগত তথ্য</h2><p class="bn">রেজিস্ট্রেশনের সময় ক্লাস দেওয়া বাধ্যতামূলক নয়।</p></div></div><form id="profileForm" onsubmit="saveProfile(event)" class="form-grid"><div class="field full"><label class="bn">নাম</label><input id="profileName" class="input" value="${attr(p.name||'')}" required></div><div class="field full"><label class="bn">ইমেইল</label><input class="input" value="${attr(currentUser.email||'')}" disabled></div><div class="field"><label class="bn">লিঙ্গ</label><select id="profileGender" class="select"><option value="">নির্বাচন করুন</option><option value="male" ${p.gender==='male'?'selected':''}>পুরুষ</option><option value="female" ${p.gender==='female'?'selected':''}>নারী</option><option value="prefer_not_to_say" ${p.gender==='prefer_not_to_say'?'selected':''}>উল্লেখ করতে চাই না</option></select></div><div class="field"><label class="bn">মোবাইল (ঐচ্ছিক)</label><input id="profilePhone" class="input" type="tel" value="${attr(p.phone||'')}" placeholder="01XXXXXXXXX"></div><div class="field"><label class="bn">ক্লাস (ঐচ্ছিক)</label><input id="profileClass" class="input" value="${attr(p.class||'')}" placeholder="যেমন: HSC 2027"></div><div class="field"><label class="bn">ব্যাচ (ঐচ্ছিক)</label><input id="profileBatch" class="input" value="${attr(p.batch||'')}" placeholder="যেমন: Admission 27"></div><div class="field full"><button class="btn btn-green btn-block bn" type="submit"><i class="fa-solid fa-floppy-disk"></i> প্রোফাইল সেভ করুন</button></div></form><div style="height:1px;background:var(--line);margin:23px 0"></div><div class="section-head"><div><h2 class="bn" style="font-size:18px">পাসওয়ার্ড পরিবর্তন</h2><p class="bn">নিরাপত্তার জন্য বর্তমান পাসওয়ার্ড প্রয়োজন হবে।</p></div></div><form class="form-grid" onsubmit="changePassword(event)"><div class="field full"><label class="bn">বর্তমান পাসওয়ার্ড</label><input id="oldPassword" class="input" type="password" autocomplete="current-password" required></div><div class="field full"><label class="bn">নতুন পাসওয়ার্ড</label><input id="newPassword" class="input" type="password" minlength="6" autocomplete="new-password" required></div><div class="field full"><button class="btn btn-dark btn-block b function openContentViewer(item,opts={}){const type=normalizeLinkType(item),url=safeUrl(item.link||''),title=item.title||typeName(type),chapter=item.chapter||'',course=opts.course||null;const id=course?.id||item.linkedCourse||item.selectedCourseId||'';if(type==='exam'){const code=parseResourceCode(item.link||'');const raw=code?.type==='exam'?code.id:String(item.link||'').trim();const exam=exams.find(e=>e.id===raw||e.title===raw);if(exam){openExamTarget(exam.id);return}showError('এই ম্যাটেরিয়ালের সঙ্গে যুক্ত পরীক্ষা পাওয়া যায়নি।');return}if(!url){showError('কনটেন্টের লিংকটি সঠিক নয়।');return}let relatedPdfHtml='';if(type==='video'){let related=[];if(course&&Number.isInteger(opts.sectionIndex)&&Number.isInteger(opts.itemIndex)){const section=itemsForCourse(course)[opts.sectionIndex];const list=section?.items||[];const currentChapter=String(item.chapter||'').trim().toLowerCase();related=list.map((it,j)=>({it,j})).filter(({it,j})=>j!==opts.itemIndex&&normalizeLinkType(it)==='pdf'&&(!currentChapter||String(it.chapter||section?.title||'').trim().toLowerCase()===currentChapter))}else if(id){const currentChapter=String(item.chapter||'').trim().toLowerCase();related=contents.filter(x=>(x.linkedCourse||x.selectedCourseId)===id&&normalizeLinkType(x)==='pdf'&&(!currentChapter||String(x.chapter||'').trim().toLowerCase()===currentChapter)).map(it=>({it,material:true}));}if(related.length)relatedPdfHtml=`<section class="related-pdfs"><h3 class="bn"><i class="fa-solid fa-file-pdf"></i> এই অধ্যায়ের PDF / নোটস</h3><div class="related-pdf-list">${related.map(({it,j,material})=>`<button type="button" class="related-pdf bn" onclick="${material?`openMaterialById('${attr(it.id)}')`:`openCourseItem('${attr(id)}',${opts.sectionIndex},${j})`}"><i class="fa-solid fa-file-pdf"></i><span>${esc(it.title||'PDF / নোটস')}</span><i class="fa-solid fa-arrow-up-right-from-square"></i></button>`).join('')}</div></section>`}const player=type==='video'?videoPlayerHTML(url,title):`<iframe class="video-fra function videoEmbed(url){try{const u=new URL(url),host=u.hostname.replace(/^www\./,'');if(host==='youtu.be')return 'https://www.youtube-nocookie.com/embed/'+u.pathname.slice(1).split('/')[0];if(host.endsWith('youtube.com')||host==='youtube-nocookie.com'){if(u.pathname==='/watch'&&u.searchParams.get('v'))return 'https://www.youtube-nocookie.com/embed/'+u.searchParams.get('v');if(u.pathname.startsWith('/embed/'))return 'https://www.youtube-nocookie.com'+u.pathname;if(u.pathname.startsWith('/shorts/'))return 'https://www.youtube-nocookie.com/embed/'+u.pathname.split('/')[2]}if((host==='vimeo.com'||host.endsWith('.vimeo.com'))){const id=u.pathname.split('/').filter(Boolean).pop();return id?'https://player.vimeo.com/video/'+id:url}if(host==='drive.google.com'&&u.pathname.includes('/file/d/')){const id=u.pathname.split('/file/d/')[1].split('/')[0];return 'https://drive.google.com/file/d/'+id+'/preview'}return url}catch(_){return ''}}

/* ===== Hierarchical course content: Section → Sub-section → lesson page ===== */
function itemsForCourse(c){
 const sections=(Array.isArray(c.sections)?c.sections:[]).map(s=>{
  let subs=Array.isArray(s.subsections)&&s.subsections.length?s.subsections.map(sub=>({...sub,items:Array.isArray(sub.items)?sub.items.map(it=>({...it,shortDescription:it.shortDescription||it.description||it.details||''})):[]})):
   [{title:s.title||s.subject||'সাধারণ',description:'',items:Array.isArray(s.items)?s.items.map(it=>({...it,shortDescription:it.shortDescription||it.description||it.details||''})):[]}];
  return {...s,subsections:subs,items:subs.flatMap(sub=>sub.items||[])};
 });
 const related=contents.filter(x=>(x.linkedCourse||x.selectedCourseId)===c.id&&x.fromCourseManager!==true);
 for(const x of related){
  const type=normalizeLinkType(x),sectionName=String(x.courseSection||'').trim(),subject=String(x.subject||'সাধারণ').trim();
  let section=sections.find(s=>sectionName&&(String(s.title||'').trim()===sectionName||String(s.subject||'').trim()===sectionName));
  if(!section&&subject)section=sections.find(s=>String(s.subject||'').trim()===subject&&(!sectionName||String(s.title||'').trim()===sectionName));
  if(!section){const title=sectionName||subject||'ক্লাস ও ম্যাটেরিয়াল';section={subject,title,thumbnail:x.thumbnail||'',description:'',subsections:[],items:[]};sections.push(section)}
  if(!Array.isArray(section.subsections))section.subsections=[];
  let subName=String(x.courseSubsection||'').trim();
  if(!subName){subName=section.subsections.length===1?String(section.subsections[0].title||'সাধারণ'):String(x.chapter||'সাধারণ').trim()}
  let sub=section.subsections.find(z=>String(z.title||'').trim()===subName);
  if(!sub){sub={title:subName||'সাধারণ',description:'',items:[]};section.subsections.push(sub)}
  if(!Array.isArray(sub.items))sub.items=[];
  const duplicate=sub.items.some(it=>String(it.link||'').trim()===String(x.link||'').trim()&&String(it.title||'').trim()===String(x.title||'').trim()&&normalizeLinkType(it)===type);
  if(!duplicate)sub.items.push({id:x.id,materialId:x.id,title:x.title||x.chapter||sub.title,type,chapter:x.chapter||sub.title,shortDescription:x.shortDescription||x.description||x.details||'',description:x.shortDescription||x.description||x.details||'',rule:x.rule||(x.accessMode==='course'||isPremiumFlag(x.isPremium)?'mandatory':'optional'),link:x.link||'',thumbnail:x.thumbnail||section.thumbnail||'',linkedCourse:c.id,accessMode:x.accessMode||'',fromContents:true});
  section.items=subsectionItems(section);
 }
 return sections;
}
function subsectionItems(section){return (section.subsections||[]).flatMap(s=>s.items||[])}

function openCourseContent(id){if(!courseIsEnrolled(id)){Swal.fire({title:'কোর্সে এনরোল করুন',text:'কোর্সের ক্লাস, PDF ও পরীক্ষা দেখতে আগে এনরোল করতে হবে।',icon:'info',confirmButtonText:'ঠিক আছে',confirmButtonColor:'#07875a'});return}window.activeCourseId=id;window.courseContentMode=true;window.courseContentLevel='sections';window.courseContentSectionIndex=-1;window.courseContentSubsectionIndex=-1;window.courseContentItemIndex=-1;updateContentTabHash(id,'sections',-1,-1,-1);currentPage='courseDetails';renderPage();navActive();window.scrollTo({top:0,behavior:'smooth'})}
function openCourse(id){window.activeCourseId=id;window.courseContentMode=false;window.courseContentLevel='sections';try{history.replaceState(null,'',window.location.href.split('#')[0])}catch(_){}currentPage='courseDetails';renderPage();navActive();window.scrollTo({top:0,behavior:'smooth'})}
function openCourseSection(courseId,sectionIndex){const c=courses.find(x=>x.id===courseId);if(!c)return;if(!courseIsEnrolled(courseId)){startEnrollment(courseId);return}if(openContentTab(courseId,'section',sectionIndex,-1,-1))return;window.activeCourseId=courseId;window.courseContentMode=true;window.courseContentLevel='section';window.courseContentSectionIndex=sectionIndex;window.courseContentSubsectionIndex=-1;updateContentTabHash(courseId,'section',sectionIndex,-1,-1);currentPage='courseDetails';renderPage();window.scrollTo({top:0,behavior:'smooth'})}
function openCourseSubsection(courseId,sectionIndex,subsectionIndex){const c=courses.find(x=>x.id===courseId);if(!c)return;if(!courseIsEnrolled(courseId)){startEnrollment(courseId);return}if(openContentTab(courseId,'subsection',sectionIndex,subsectionIndex,-1))return;window.activeCourseId=courseId;window.courseContentMode=true;window.courseContentLevel='subsection';window.courseContentSectionIndex=sectionIndex;window.courseContentSubsectionIndex=subsectionIndex;updateContentTabHash(courseId,'subsection',sectionIndex,subsectionIndex,-1);currentPage='courseDetails';renderPage();window.scrollTo({top:0,behavior:'smooth'})}
function openCourseLesson(courseId,sectionIndex,subsectionIndex,itemIndex){
 const c=courses.find(x=>x.id===courseId);if(!c)return;if(!courseIsEnrolled(courseId)){startEnrollment(courseId);return}
 const sec=itemsForCourse(c)[sectionIndex],sub=sec?.subsections?.[subsectionIndex],item=sub?.items?.[itemIndex];if(!item)return;
 const raw=String(item.link||'').trim(),code=parseResourceCode(raw);
 if(code?.type==='course'){openCourse(code.id);return}if(code?.type==='material'){openMaterialById(code.id);return}if(code?.type==='exam'){openExamTarget(code.id);return}
 if(normalizeLinkType(item)==='exam'){const exam=exams.find(e=>e.id===raw||e.title===raw);if(exam){openExamTarget(exam.id);return}const external=safeUrl(raw);if(external){window.open(external,'_blank','noopener');return}showError('এই পরীক্ষার ID বা লিংক সঠিক নয়।');return}
 if(openContentTab(courseId,'lesson',sectionIndex,subsectionIndex,itemIndex))return;window.activeCourseId=courseId;window.courseContentMode=true;window.courseContentLevel='lesson';window.courseContentSectionIndex=sectionIndex;window.courseContentSubsectionIndex=subsectionIndex;window.courseContentItemIndex=itemIndex;updateContentTabHash(courseId,'lesson',sectionIndex,subsectionIndex,itemIndex);currentPage='courseDetails';renderPage();window.scrollTo({top:0,behavior:'smooth'});
}
function renderCourseLessonView(c,section,subsection,item){
 const id=c.id,type=normalizeLinkType(item),url=safeUrl(item.link||''),details=item.shortDescription||item.description||item.details||'';
 let player='';if(type==='video')player=url?videoPlayerHTML(url,item.title||'ভিডিও ক্লাস'):`<div class="error-note bn">এই ভিডিওর লিংকটি সঠিক নয়।</div>`;else if(type==='pdf')player=url?`<iframe class="video-frame" style="min-height:65vh" src="${attr(pdfEmbed(url))}" allow="autoplay" loading="lazy" title="${attr(item.title||'PDF')}"></iframe>`:`<div class="error-note bn">এই PDF-এর লিংকটি সঠিক নয়।</div>`;
 $('appMain').innerHTML=`<div class="wrap"><div class="page-title"><div><button class="back-button bn" onclick="openCourseSubsection('${attr(id)}',${window.courseContentSectionIndex},${window.courseContentSubsectionIndex})"><i class="fa-solid fa-arrow-left"></i> Sub-section-এ ফিরে যান</button><h1 class="bn" style="margin-top:13px">${esc(item.title||typeName(type))}</h1><p class="bn">${esc(c.title||'কোর্স')} • ${esc(section.title||section.subject||'Section')} • ${esc(subsection.title||'Sub-section')}</p></div><span class="tag bn"><i class="fa-solid fa-circle-check"></i> এনরোল করা আছে</span></div><section class="section lesson-view-card"><div class="lesson-view-player">${player}</div><div class="lesson-view-details"><span class="tag bn">${type==='video'?'ভিডিও ক্লাস':type==='pdf'?'PDF / নোটস':'পরীক্ষা'}</span><h2 class="bn">${esc(item.title||'কনটেন্ট')}</h2>${details?`<p class="bn lesson-short-description">${esc(details)}</p>`:`<p class="bn muted">এই কনটেন্টের জন্য এখনো কোনো সংক্ষিপ্ত বিবরণ যোগ করা হয়নি।</p>`}${item.chapter?`<p class="bn muted">অধ্যায়: ${esc(item.chapter)}</p>`:''}${url?`<a class="btn btn-green bn" href="${attr(url)}" target="_blank" rel="noopener"><i class="fa-solid fa-arrow-up-right-from-square"></i> নতুন ব্রাউজার ট্যাবে খুলুন</a>`:''}</div></section></div>`;
}
function renderEnrolledCourseContent(c){
 const id=c.id,sections=itemsForCourse(c),level=window.courseContentLevel||'sections',si=Number(window.courseContentSectionIndex),sbi=Number(window.courseContentSubsectionIndex);
 const sec=sections[si],sub=sec?.subsections?.[sbi];
 if(level==='lesson'){const item=sub?.items?.[Number(window.courseContentItemIndex)];if(item){renderCourseLessonView(c,sec,sub,item);return}window.courseContentLevel='subsection'}
 const backButton=(label,onclick)=>`<button class="back-button bn" onclick="${onclick}"><i class="fa-solid fa-arrow-left"></i> ${label}</button>`;
 let inner='';
 if(level==='section'&&sec){inner=`<div class="section-head"><div><h2 class="bn">${esc(sec.title||sec.subject||'Section')}</h2><p class="bn">এই Section-এর Sub-section বেছে নিন।</p></div></div>${sec.description?`<p class="bn muted" style="line-height:1.8">${esc(sec.description)}</p>`:''}${(sec.subsections||[]).length?`<div class="content-step-grid">${sec.subsections.map((ss,i)=>`<button class="content-step-card bn" onclick="openCourseSubsection('${attr(id)}',${si},${i})"><span class="content-step-icon"><i class="fa-solid fa-folder-tree"></i></span><span class="content-step-copy"><strong>${esc(ss.title||`Sub-section ${i+1}`)}</strong><small>${(ss.items||[]).length}টি ভিডিও / ম্যাটেরিয়াল</small>${ss.description?`<small>${esc(ss.description)}</small>`:''}</span><i class="fa-solid fa-chevron-right content-step-arrow"></i></button>`).join('')}</div>`:emptyState('fa-folder-open','এই Section-এ এখনো কোনো Sub-section নেই।')}`}
 else if(level==='subsection'&&sec&&sub){inner=`<div class="section-head"><div><h2 class="bn">${esc(sub.title||'Sub-section')}</h2><p class="bn">ভিডিও, PDF বা পরীক্ষা খুলতে কনটেন্টে চাপ দিন।</p></div></div>${sub.description?`<p class="bn muted" style="line-height:1.8">${esc(sub.description)}</p>`:''}${(sub.items||[]).length?`<div class="content-step-grid">${sub.items.map((item,i)=>{const t=normalizeLinkType(item),ico=t==='video'?'fa-circle-play':t==='pdf'?'fa-file-pdf':'fa-pen-to-square';return `<button class="content-step-card bn" onclick="openCourseLesson('${attr(id)}',${si},${sbi},${i})"><span class="content-step-icon ${t==='pdf'?'pdf':t==='exam'?'exam':''}"><i class="fa-solid ${ico}"></i></span><span class="content-step-copy"><strong>${esc(item.title||typeName(t))}</strong><small>${t==='video'?'ভিডিও ক্লাস':t==='pdf'?'PDF / নোটস':'পরীক্ষা / Quiz'}${item.chapter?' • '+esc(item.chapter):''}</small>${item.shortDescription||item.description?`<small>${esc(item.shortDescription||item.description)}</small>`:''}</span><i class="fa-solid fa-chevron-right content-step-arrow"></i></button>`}).join('')}</div>`:emptyState('fa-circle-play','এই Sub-section-এ এখনো কোনো কনটেন্ট নেই।')}`}
 else{inner=`<div class="section-head"><div><h2 class="bn">কোর্সের Section</h2><p class="bn">প্রথমে Section, তারপর Sub-section, এরপর ভিডিও বা ম্যাটেরিয়াল খুলুন।</p></div></div>${sections.length?`<div class="content-step-grid">${sections.map((section,i)=>{const count=(section.subsections||[]).length;const image=safeUrl(section.thumbnail||'');return `<button class="content-step-card bn" onclick="openCourseSection('${attr(id)}',${i})">${image?`<img class="content-step-thumb" src="${attr(image)}" alt="">`:`<span class="content-step-icon"><i class="fa-solid fa-folder-open"></i></span>`}<span class="content-step-copy"><strong>${esc(section.title||section.subject||`Section ${i+1}`)}</strong><small>${esc(section.subject||'কোর্স Section')} · ${count}টি Sub-section</small>${section.description?`<small>${esc(section.description)}</small>`:''}</span><i class="fa-solid fa-chevron-right content-step-arrow"></i></button>`}).join('')}</div>`:emptyState('fa-layer-group','এই কোর্সে এখনো কোনো Section যোগ করা হয়নি।','অ্যাডমিন প্যানেল থেকে Section, Sub-section ও ভিডিও যোগ করুন।')}`}
 let back='';if(level==='sections')back=backButton('কোর্সের বিবরণ',`openCourse('${attr(id)}')`);else if(level==='section')back=backButton('সব Section',`openCourseContent('${attr(id)}')`);else if(level==='subsection')back=backButton('Section-এ ফিরে যান',`openCourseSection('${attr(id)}',${si})`);
 $('appMain').innerHTML=`<div class="wrap"><div class="page-title"><div>${back}<h1 class="bn" style="margin-top:13px">${esc(c.title||'কোর্স কনটেন্ট')}</h1><p class="bn">${level==='sections'?'কোর্সের কনটেন্ট':level==='section'?'Section-এর Sub-section': 'Sub-section-এর কনটেন্ট'}</p></div><span class="tag bn"><i class="fa-solid fa-circle-check"></i> এনরোল করা আছে</span></div>${c.announcement?`<section class="course-announcement"><h2 class="bn"><i class="fa-solid fa-bullhorn"></i> কোর্স ঘোষণা</h2><p class="bn">${esc(c.announcement)}</p></section>`:''}<section class="section">${inner}</section></div>`;
}


function updateContentTabHash(courseId,level,sectionIndex=-1,subsectionIndex=-1,itemIndex=-1){try{const payload={courseId,level,sectionIndex,subsectionIndex,itemIndex};history.replaceState(null,'',window.location.href.split('#')[0]+'#onushilon-content='+encodeURIComponent(JSON.stringify(payload)))}catch(err){console.warn('Could not update content URL',err)}}
function openContentTab(courseId,level,sectionIndex=-1,subsectionIndex=-1,itemIndex=-1){
 // Mobile browsers may silently block script-opened tabs. Always let the
 // caller render the requested section in the current tab as a reliable fallback.
 return false;
}
function restoreContentRouteFromHash(){
 try{const prefix='#onushilon-content=';if(!window.location.hash.startsWith(prefix))return;const d=JSON.parse(decodeURIComponent(window.location.hash.slice(prefix.length)));if(!d||!d.courseId)return;window.activeCourseId=String(d.courseId);window.courseContentMode=true;window.courseContentLevel=['sections','section','subsection','lesson'].includes(d.level)?d.level:'sections';window.courseContentSectionIndex=Number.isInteger(Number(d.sectionIndex))?Number(d.sectionIndex):-1;window.courseContentSubsectionIndex=Number.isInteger(Number(d.subsectionIndex))?Number(d.subsectionIndex):-1;window.courseContentItemIndex=Number.isInteger(Number(d.itemIndex))?Number(d.itemIndex):-1;currentPage='courseDetails';}
 catch(err){console.warn('Could not restore course content route',err)}
}
window.addEventListener('hashchange',restoreContentRouteFromHash);
restoreContentRouteFromHash();

</script>
</body>
</html>
